<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云逸 - 开发者主页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #eee;
        }
        .container { text-align: center; padding: 40px; max-width: 600px; }
        h1 { font-size: 2.5em; margin-bottom: 16px; background: linear-gradient(90deg, #00d4ff, #7b2ff7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { font-size: 1.1em; opacity: 0.8; margin-bottom: 12px; line-height: 1.6; }
        .tags { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
        .tag { background: rgba(255,255,255,0.1); padding: 6px 16px; border-radius: 20px; font-size: 0.85em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>云逸</h1>
        <p>软件开发者 | 逆向工程爱好者 | 开源贡献者</p>
        <p>专注于Android安全、二进制分析与AI工具开发</p>
        <div class="tags">
            <span class="tag">Android</span>
            <span class="tag">Reverse Engineering</span>
            <span class="tag">Python</span>
            <span class="tag">AI Tools</span>
        </div>
    </div>
</body>
</html>
